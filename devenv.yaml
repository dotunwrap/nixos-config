inputs:
  nix-auto-follow:
    url: github:fzakaria/nix-auto-follow
    inputs:
      nixpkgs:
        follows: nixpkgs
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling

secretspec:
  enable: true
  profile: default
  # No explicit `provider:` override here: an explicit override forces that
  # single provider for every secret. Leaving it unset lets each secret's own
  # `providers` fallback chain in secretspec.toml run instead, so `keyring`
  # (used on real dev machines) can fall back to `env` wherever no keyring/dbus
  # session exists (CI runners, minimal servers, containers).

# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  nix-auto-follow:
    url: github:fzakaria/nix-auto-follow
    inputs:
      nixpkgs:
        follows: nixpkgs
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling

secretspec:
  enable: true
  profile: default
  provider: env

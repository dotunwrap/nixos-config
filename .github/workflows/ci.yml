name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      nix-version: ${{ steps.nix-version.outputs.version }}
      packages: ${{ steps.set-matrix.outputs.packages }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
      - name: Resolve nix version from flake.lock's nixpkgs pin
        id: nix-version
        run: echo "version=$(scripts/resolve-nix-version.sh)" >> "$GITHUB_OUTPUT"
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          nix-version: ${{ steps.nix-version.outputs.version }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Compute build matrix
        id: set-matrix
        run: |
          packages=$(nix eval .#packages.x86_64-linux --apply builtins.attrNames --json)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  devenv_test:
    name: Devenv test
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          nix-version: ${{ needs.plan.outputs.nix-version }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Install cachix
        uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Build the devenv shell and run all git hooks
        run: devenv test

  build:
    name: Build ${{ matrix.package }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.plan.outputs.packages) }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          nix-version: ${{ needs.plan.outputs.nix-version }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Build
        env:
          PACKAGE: ${{ matrix.package }}
        run: nix build ".#packages.x86_64-linux.\"$PACKAGE\"" --no-link --print-build-logs

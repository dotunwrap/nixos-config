name: ci

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks-matrix:
    name: checks-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      nix-version: ${{ steps.nix-version.outputs.version }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
      - name: Resolve nix version from flake.lock's nixpkgs pin
        id: nix-version
        run: echo "version=$(scripts/resolve-nix-version.sh)" >> "$GITHUB_OUTPUT"
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          nix-version: ${{ steps.nix-version.outputs.version }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Compute checks matrix
        id: set-matrix
        run: |
          matrix=$(nix eval --json '.#githubActions.matrix')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  devenv_test:
    name: devenv test
    needs: checks-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          nix-version: ${{ needs.checks-matrix.outputs.nix-version }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Install cachix
        uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Build the devenv shell and run all git hooks
        run: devenv test

  checks:
    name: ${{ matrix.name }}
    needs: checks-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.checks-matrix.outputs.matrix) }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          nix-version: ${{ needs.checks-matrix.outputs.nix-version }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Build
        run: nix build -L ".#${{ matrix.attr }}" --no-link

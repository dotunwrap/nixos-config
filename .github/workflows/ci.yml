# This is copied almost directly from @NobbZ/nixos-config
name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

jobs:
  devenv_test:
    name: Devenv test
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Install cachix
        uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Build the devenv shell and run all git hooks
        run: devenv test

  matrix:
    name: Compute build matrix
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: List output derivations
        id: set-matrix
        run: |
          packages=$(nix eval .#packages.x86_64-linux --apply builtins.attrNames --json)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.matrix.outputs.packages) }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Build
        env:
          PACKAGE: ${{ matrix.package }}
        run: nix build ".#packages.x86_64-linux.\"$PACKAGE\"" --no-link --print-build-logs

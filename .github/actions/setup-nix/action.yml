name: Setup Nix
description: Install a specific Nix version and configure SSH access for private flake inputs (e.g. the monolisa git+ssh input)

inputs:
  nix-version:
    description: Exact Nix version to install (see scripts/resolve-nix-version.sh)
    required: true
  ssh-private-key:
    description: Private key with access to the private flake inputs
    required: true

runs:
  using: composite
  steps:
    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          auto-optimise-store = true
          experimental-features = nix-command flakes
        install_url: https://releases.nixos.org/nix/nix-${{ inputs.nix-version }}/install
    - name: Setup cachix caches
      uses: cachix/cachix-action@v16
      with:
        name: nix-community
        extraPullNames: vicinae,yazi
    - name: Setup SSH
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.ssh-private-key }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan github.com >> ~/.ssh/known_hosts
    - name: Configure git for SSH
      shell: bash
      run: git config --global url."git@github.com:".insteadOf "https://github.com/"
